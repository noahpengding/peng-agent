services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    networks:
      - agent
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - /data/peng-agent/qdrant:/qdrant/storage
    security_opt:
      - no-new-privileges=true

  peng-agent-mysql:
    image: mysql:lts
    container_name: peng-agent-mysql
    hostname: peng-agent
    restart: always
    networks:
      - agent
    ports:
      - "3306:3306"
    env_file:
      - ./.env
    volumes:
      - /data/peng-agent/mysql:/var/lib/mysql
    security_opt:
      - no-new-privileges=true

  peng-agent-redis:
    image: redis:latest
    container_name: peng-agent-redis
    restart: always
    networks:
      - agent
    ports:
      - "6379:6379"
    security_opt:
      - no-new-privileges=true

  datadog-agent:
    image: registry.datadoghq.com/agent:latest
    container_name: peng-agent-datadog
    hostname: datadog-agent
    restart: always
    networks:
      - agent
    env_file:
      - ./.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    security_opt:
      - no-new-privileges=true

networks:
  agent:
    driver: bridge
    name: agent
    internal: false
