[project]
name = "Peng-Agent"
version = "2.4.7"
description = "A LLM ongoing chat agent for learning"
authors = [
    { name = "Noah Ding", email = "noah@dingyipeng.com" },
    { name = "Tena Walcott", email = "tw@tenawalcott.com" }
]
dependencies = [
    "aiohttp>=3.14.1",
    "anthropic>=0.105.2",
    "bcrypt>=5.0.0",
    "boto3>=1.43.34",
    "brotli>=1.2.0",
    "bs4>=0.0.2",
    "cryptography>=48.0.1",
    "ddtrace>=4.10.2",
    "email-to>=0.1.0",
    "fastapi>=0.136.3",
    "filelock>=3.29.1",
    "google-genai>=2.8.0",
    "idna>=3.15",
    "importlib>=1.0.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.0",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain[openai]>=1.3.9",
    "langgraph>=1.2.4",
    "langsmith>=0.8.18",
    "lxml>=6.1.1",
    "mcp>=1.27.2",
    "mysql-connector-python>=9.7.0",
    "nest-asyncio>=1.6.0",
    "nltk>=3.9.4",
    "numpy>=2.4.6",
    "openai>=2.41.0",
    "openinference-instrumentation-langchain>=0.1.66",
    "openpyxl>=3.1.5",
    "openrouter>=0.9.1",
    "orjson>=3.11.9",
    "pandas>=3.0.3",
    "paramiko>=5.0.0",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "protobuf>=6.33.6",
    "pyasn1>=0.6.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymupdf>=1.27.2.3",
    "pymysql>=1.2.0",
    "pynacl>=1.6.2",
    "pypdf>=6.13.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "redis>=8.0.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
    "starlette>=0.8.18",
    "tavily-python>=0.7.25",
    "urllib3>=2.7.0",
    "uvicorn>=0.49.0",
    "wikipedia>=1.4.0",
    "xai-sdk>=1.15.0",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "config", "models", "handlers", "services"]

[tool.ruff]
extend-exclude = ["archive/**", "test/**"]
