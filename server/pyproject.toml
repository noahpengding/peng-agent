[project]
name = "Peng-Agent"
version = "2.4.6"
description = "A LLM ongoing chat agent for learning"
authors = [
    { name = "Noah Ding", email = "noah@dingyipeng.com" },
    { name = "Tena Walcott", email = "tw@tenawalcott.com" }
]
dependencies = [
    "aiohttp>=3.14.1",
    "anthropic>=0.116.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.40",
    "brotli>=1.2.0",
    "bs4>=0.0.2",
    "cryptography>=49.0.0",
    "ddtrace>=4.10.6",
    "email-to>=0.1.0",
    "fastapi>=0.139.0",
    "filelock>=3.29.5",
    "google-genai>=2.10.0",
    "importlib>=1.0.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.8",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain[openai]>=1.3.11",
    "langgraph>=1.2.7",
    "langsmith>=0.9.7",
    "lxml>=6.1.1",
    "mcp>=1.28.1",
    "mysql-connector-python>=9.7.0",
    "nest-asyncio>=1.6.0",
    "nltk>=3.9.4",
    "numpy>=2.5.1",
    "openai>=2.44.0",
    "openinference-instrumentation-langchain>=0.1.67",
    "openpyxl>=3.1.5",
    "openrouter>=0.10.8",
    "orjson>=3.11.9",
    "pandas>=3.0.3",
    "paramiko>=5.0.0",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "protobuf>=6.33.6",
    "pyasn1>=0.6.3",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.0",
    "pymysql>=1.2.0",
    "pynacl>=1.6.2",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "tavily-python>=0.7.26",
    "urllib3>=2.7.0",
    "uvicorn>=0.50.0",
    "wikipedia>=1.4.0",
    "xai-sdk>=1.17.0",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "config", "models", "handlers", "services"]

[tool.ruff]
extend-exclude = ["archive/**", "test/**"]
